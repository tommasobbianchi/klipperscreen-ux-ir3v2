#
# ux print-control menu — what the job screen's gear button opens mid-print.
# Same big-tile pager idiom as the main tree.
#
# The repo previously shipped no print_menu.conf, so the device ran the stock one, which
# has Camera commented out. On a machine with two enabled cameras that meant there was no
# way to watch a running print. Ordered by what you actually reach for mid-print.
#
[menu __print]
name: {{ gettext('Print Control') }}

[menu __print camera]
name: {{ gettext('Camera') }}
icon: camera
panel: camera
enable: {{ moonraker.cameras.count > 0 }}

[menu __print temperature]
name: {{ gettext('Temperature') }}
icon: heat-up
panel: temperature
enable: {{ (printer.temperature_devices.count > 0) or (printer.extruders.count > 0) }}

[menu __print fan]
name: {{ gettext('Fan') }}
icon: fan
panel: fan
enable: {{ printer.fans.count > 0 }}

# Move/Extrude only while paused — moving the head mid-print would wreck the part.
[menu __print move]
name: {{ gettext('Move') }}
icon: move
panel: move
enable: {{ printer.pause_resume.is_paused }}

[menu __print extrude]
name: {{ gettext('Extrude') }}
icon: extrude
panel: extrude
enable: {{ printer.extruders.count > 0 and printer.pause_resume.is_paused }}

[menu __print console]
name: {{ gettext('Console') }}
icon: console
panel: console

[menu __print limits]
name: {{ gettext('Limits') }}
icon: fine-tune
panel: limits

[menu __print network]
name: {{ gettext('Network') }}
icon: network
panel: network

[menu __print settings]
name: {{ gettext('Display') }}
icon: settings
panel: settings

[menu __print led]
name: {{ gettext('Leds') }}
icon: light
panel: led
enable: {{ printer.leds.count > 0 }}

[menu __print power]
name: {{ gettext('Power') }}
icon: shutdown
panel: power
enable: {{ moonraker.power_devices.count > 0 }}
