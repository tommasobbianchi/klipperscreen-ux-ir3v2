#
# ux nested menu — few big items per screen, drill-down. Part of the U1 clone.
#
[menu __main]
name: {{ gettext('Main Menu') }}

[menu __main print]
name: {{ gettext('Print') }}
icon: sd
panel: gcodes
enable: {{ printer.extruders.count > 0 }}

[menu __main prepare]
name: {{ gettext('Prepare') }}
icon: move

[menu __main settings]
name: {{ gettext('Settings') }}
icon: settings

# Two cameras are enabled on this machine and nothing in the tree reached either —
# on a belt printer watching the take-off is a primary action, not a settings detail.
[menu __main camera]
name: {{ gettext('Camera') }}
icon: camera
panel: camera
enable: {{ moonraker.cameras.count > 0 }}

# ---- Prepare ----
[menu __main prepare homeall]
name: {{ gettext('Home All') }}
icon: home
method: printer.gcode.script
params: {"script":"G28"}

[menu __main prepare move]
name: {{ gettext('Move') }}
icon: move
panel: move

[menu __main prepare temperature]
name: {{ gettext('Temperature') }}
icon: heat-up
panel: temperature
enable: {{ (printer.temperature_devices.count > 0) or (printer.extruders.count > 0) }}

[menu __main prepare extrude]
name: {{ gettext('Extrude') }}
icon: extrude
panel: extrude
enable: {{ printer.extruders.count > 0 }}

# Fine Tuning was reachable ONLY from the job screen, so the belt Z offset could not be
# trimmed between prints — the one moment you actually want to set it before committing.
[menu __main prepare finetune]
name: {{ gettext('Fine Tuning') }}
icon: fine-tune
panel: fine_tune

[menu __main prepare fan]
name: {{ gettext('Fan') }}
icon: fan
panel: fan
enable: {{ printer.fans.count > 0 }}

# ---- Settings ----
[menu __main settings level]
name: {{ gettext('Auto Leveling') }}
icon: bed-level
method: printer.gcode.script
params: {"script":"CALIBRATE"}

[menu __main settings bedmesh]
name: {{ gettext('Bed Mesh') }}
icon: bed-mesh
panel: bed_mesh
enable: {{ 'bed_mesh' in printer.config_sections }}

[menu __main settings limits]
name: {{ gettext('Limits') }}
icon: fine-tune
panel: limits

[menu __main settings network]
name: {{ gettext('Network') }}
icon: network
panel: network

[menu __main settings system]
name: {{ gettext('System') }}
icon: info
panel: system
enable: {{ moonraker_connected }}

# The KlipperScreen preferences panel (theme, font size, screen blanking, language) was
# reachable during a print via __print but not from the idle menu — stock main_menu had it.
[menu __main settings display]
name: {{ gettext('Display') }}
icon: settings
panel: settings

# [displayed_macros Printer] is configured on this machine, but nothing reached the panel
# it controls, so that config was inert.
[menu __main settings macros]
name: {{ gettext('Macros') }}
icon: custom-script
panel: gcode_macros
enable: {{ printer.gcode_macros.count > 0 }}

[menu __main settings console]
name: {{ gettext('Console') }}
icon: console
panel: console

[menu __main settings save]
name: {{ gettext('Save Config') }}
icon: complete
method: printer.gcode.script
params: {"script":"SAVE_CONFIG"}
confirm:
    {{ gettext('Save configuration?') }}

    {{ gettext('Klipper will reboot') }}
